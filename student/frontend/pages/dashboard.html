<!-- =========================================================
     Doctor Review / Admin Comment Card
     ========================================================= -->

<div
  id="review-card"
  class="doctor-review-card hidden animate-on-scroll"
>

  <div class="doctor-review-header">

    <div class="doctor-review-title-wrapper">

      <div class="doctor-review-icon">

        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"
          />

          <polyline
            points="8 10 10 12 16 7"
          />
        </svg>

      </div>

      <div>

        <h3>
          Doctor's Review
        </h3>

        <p>
          Latest feedback on your project
        </p>

      </div>

    </div>


    <span
      id="doctor-review-decision"
      class="review-decision"
    >
      —
    </span>

  </div>


  <div class="doctor-review-body">

    <div class="doctor-review-label">
      Comment
    </div>

    <div
      id="doctor-review-comment"
      class="doctor-review-comment"
    >
      —
    </div>

  </div>


  <div
    id="doctor-review-date"
    class="doctor-review-date"
  ></div>

</div>
